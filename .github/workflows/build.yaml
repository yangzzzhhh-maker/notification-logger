# .github/workflows/build-apk.yml
name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 未在根目录找到 .zip 文件"
            exit 1
          fi
          
          echo "📦 找到 ZIP: $ZIP_FILE"
          
          mkdir -p /tmp/android-src
          unzip -o "$ZIP_FILE" -d /tmp/android-src
          
          if [ $(ls -1 /tmp/android-src | wc -l) -eq 1 ]; then
            SUBDIR=$(ls -1 /tmp/android-src | head -n 1)
            if [ -d "/tmp/android-src/$SUBDIR" ]; then
              mv /tmp/android-src/$SUBDIR /tmp/android-project
            else
              mv /tmp/android-src /tmp/android-project
            fi
          else
            mv /tmp/android-src /tmp/android-project
          fi
          
          echo "📂 项目结构:"
          ls -la /tmp/android-project

      - name: Auto-fix compileSdk version
        run: |
          cd /tmp/android-project
          
          BUILD_FILE=$(find . -path "*/app/build.gradle*" | head -n 1)
          
          if [ -n "$BUILD_FILE" ]; then
            echo "🔧 找到构建文件: $BUILD_FILE"
            
            if [[ "$BUILD_FILE" == *.kts ]]; then
              sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 37/g' "$BUILD_FILE"
              sed -i 's/compileSdkVersion[[:space:]]*([0-9]\+)/compileSdkVersion(37)/g' "$BUILD_FILE"
            else
              sed -i 's/compileSdk[[:space:]]\+[0-9]\+/compileSdk 37/g' "$BUILD_FILE"
              sed -i 's/compileSdkVersion[[:space:]]\+[0-9]\+/compileSdkVersion 37/g' "$BUILD_FILE"
            fi
            
            echo "✅ 已自动修复 compileSdk 为 37"
            grep -n "compileSdk" "$BUILD_FILE" || true
          else
            echo "⚠️ 未找到 app/build.gradle*，跳过修复"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
          sdkmanager --list_installed | grep android-37

      - name: Setup Gradle (if no wrapper)
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd /tmp/android-project
          
          if [ -f "gradlew" ]; then
            echo "✅ 找到 gradlew，使用 wrapper 编译"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "⚠️ 未找到 gradlew，使用系统 Gradle 编译"
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            /tmp/android-project/**/build/outputs/apk/debug/*.apk
            /tmp/android-project/**/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
