name: Android ZIP 云编译（Kotlin 2.3.0 / compileSdk 37 / AGP 9.1.1）

on:
  push:
    paths:
      - '*.zip'
      - '*.ZIP'
  workflow_dispatch:

jobs:
  build:
    name: 解压并编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 查找根目录 ZIP
        id: find-zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \( -iname "*.zip" \) | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "错误：根目录没有找到 .zip 文件"
            ls -la
            exit 1
          fi
          echo "找到 ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "zip_name=$(basename "$ZIP_FILE")" >> $GITHUB_OUTPUT

      - name: 解压源码
        run: |
          mkdir -p source
          unzip -q "${{ steps.find-zip.outputs.zip_file }}" -d source

          if [ -f source/gradlew ] || [ -f source/build.gradle.kts ] || [ -f source/settings.gradle.kts ]; then
            echo "SOURCE_DIR=source" >> $GITHUB_ENV
          else
            CANDIDATE=$(find source -maxdepth 2 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" -o -name "build.gradle" \) | head -n 1)
            if [ -z "$CANDIDATE" ]; then
              echo "错误：解压后找不到 Android 项目特征文件"
              find source -maxdepth 3 | head -50
              exit 1
            fi
            SOURCE_DIR=$(dirname "$CANDIDATE")
            echo "SOURCE_DIR=$SOURCE_DIR" >> $GITHUB_ENV
            echo "定位到项目目录: $SOURCE_DIR"
          fi

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装平台与构建工具（compileSdk 37，Android 17 已于 2026年6月发布）
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: 设置 Gradle（AGP 9.1.1 硬性要求 Gradle >=9.1.0）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: 生成 Gradle Wrapper（源码里缺 gradlew 脚本）
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            echo "未检测到 gradlew，正在生成 Wrapper..."
            gradle wrapper --gradle-version 9.1.0
          fi
          chmod +x gradlew

      - name: 编译 Debug APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 查找并复制 APK
        run: |
          APK_PATH=$(find ${{ env.SOURCE_DIR }} -path "*/build/outputs/apk/**/*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "错误：未找到 APK，列出所有 apk："
            find ${{ env.SOURCE_DIR }} -name "*.apk" -type f || true
            exit 1
          fi
          echo "找到 APK: $APK_PATH"
          cp "$APK_PATH" ./app-debug.apk
          ls -lh app-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.find-zip.outputs.zip_name }}-${{ github.run_number }}
          path: app-debug.apk
          retention-days: 7
