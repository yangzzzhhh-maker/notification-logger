# .github/workflows/build-apk.yml
name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP file
        run: |
          # 查找根目录下的 zip 文件（取第一个）
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 未在根目录找到 .zip 文件"
            exit 1
          fi
          
          echo "📦 找到 ZIP: $ZIP_FILE"
          echo "ZIP_NAME=$ZIP_FILE" >> $GITHUB_ENV
          
          # 解压到临时目录
          mkdir -p /tmp/android-src
          unzip -o "$ZIP_FILE" -d /tmp/android-src
          
          # 处理 ZIP 内部可能多一层目录的情况
          if [ $(ls -1 /tmp/android-src | wc -l) -eq 1 ]; then
            SUBDIR=$(ls -1 /tmp/android-src | head -n 1)
            if [ -d "/tmp/android-src/$SUBDIR" ]; then
              mv /tmp/android-src/$SUBDIR /tmp/android-project
            else
              mv /tmp/android-src /tmp/android-project
            fi
          else
            mv /tmp/android-src /tmp/android-project
          fi
          
          echo "📂 项目路径: /tmp/android-project"
          ls -la /tmp/android-project

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          cd /tmp/android-project
          
          # 确保 gradlew 可执行
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "❌ 未找到 gradlew，尝试查找 build.gradle..."
            # 如果 zip 内结构特殊，递归查找
            find . -name "gradlew" -type f | head -n 1 | xargs -I {} sh -c 'cd $(dirname {}); chmod +x gradlew; ./gradlew assembleDebug --no-daemon --stacktrace'
          fi

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            /tmp/android-project/**/build/outputs/apk/debug/*.apk
            /tmp/android-project/**/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
