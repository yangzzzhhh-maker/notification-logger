name: Android ZIP 云编译

on:
  # 根目录上传/更新 zip 文件时自动触发
  push:
    paths:
      - '*.zip'
      - '*.ZIP'
  # 也可以手动触发
  workflow_dispatch:

jobs:
  build:
    name: 解压并编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 查找根目录 ZIP 文件
        id: find-zip
        run: |
          # 只在仓库根目录查找 zip（不递归）
          ZIP_FILE=$(find . -maxdepth 1 -type f \( -iname "*.zip" \) | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "错误：仓库根目录下没有找到任何 .zip 文件"
            echo "请把 Android 源码 ZIP 直接上传到仓库根目录"
            ls -la
            exit 1
          fi
          
          echo "找到 ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "zip_name=$(basename "$ZIP_FILE")" >> $GITHUB_OUTPUT

      - name: 解压源码（保留原文件名）
        run: |
          mkdir -p source
          echo "正在解压 ${{ steps.find-zip.outputs.zip_name }} ..."
          unzip -q "${{ steps.find-zip.outputs.zip_file }}" -d source
          
          # 自动找到包含 gradlew 的目录（兼容 ZIP 里多一层文件夹的情况）
          if [ -f source/gradlew ]; then
            echo "SOURCE_DIR=source" >> $GITHUB_ENV
          else
            GRADLEW_PATH=$(find source -name "gradlew" -type f | head -n 1)
            if [ -z "$GRADLEW_PATH" ]; then
              echo "错误：解压后未找到 gradlew，请确认 ZIP 是完整的 Android 项目"
              echo "当前解压内容："
              find source -maxdepth 3 -type f | head -30
              exit 1
            fi
            SOURCE_DIR=$(dirname "$GRADLEW_PATH")
            echo "SOURCE_DIR=$SOURCE_DIR" >> $GITHUB_ENV
            echo "找到项目目录: $SOURCE_DIR"
          fi

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            \~/.gradle/caches
            \~/.gradle/wrapper
          key: \( {{ runner.os }}-gradle- \){{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 编译 Debug APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 查找并复制 APK
        run: |
          APK_PATH=$(find ${{ env.SOURCE_DIR }} -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "错误：未找到任何 APK 文件"
            find ${{ env.SOURCE_DIR }} -name "*.apk" || true
            exit 1
          fi
          echo "找到 APK: $APK_PATH"
          cp "$APK_PATH" ./app-debug.apk
          ls -lh app-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-\( {{ steps.find-zip.outputs.zip_name }}- \){{ github.run_number }}
          path: app-debug.apk
          retention-days: 7
